name: Deploy interactive preview (GitHub Pages)
# Publishes the live WebGL player (real-time on a GPU machine). Enable: Settings → Pages → Source: GitHub Actions.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html src vendor data assets _site/ && rm -f _site/assets/audio/*.wav && rm -rf _site/assets/source
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
